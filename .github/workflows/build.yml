name: Build

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

# Read-only token. This job runs on every branch push and on pull requests, so
# it is the widest-reach workflow in the repo; it only needs to read the repo
# (checkout + submodule). Artifact upload uses the Actions runtime token, not
# this one. Without the block the job inherits whatever the repository default
# is, which is write on repos created before the default changed.
permissions:
  contents: read

jobs:
  build:
    name: Build and Validate
    runs-on: windows-latest
    # release.yml already builds the version-bump commit release.ps1 lands.
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          submodules: recursive

      - name: Setup Visual Studio environment
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      # run-install: false - this workspace declares no conda dependencies
      # (pixi is a task runner here; the C++ toolchain and CMake come from the
      # runner image). The action's post-install `pixi list` errors on an empty
      # environment in pixi 0.70+.
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          run-install: false

      # Build + package through the SAME command a developer runs locally. All
      # build logic lives in the pixi task chain (setup -> build-release ->
      # package); the workflow owns none, so local and CI cannot drift.
      - name: Build and package
        shell: pwsh
        run: |
          pixi run package
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::pixi run package failed"; exit 1 }

      # Same command a developer runs. Locks the Source camera maths the render
      # view depends on; nothing here needs the game installed.
      - name: Run tests
        shell: pwsh
        run: |
          pixi run test
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::pixi run test failed"; exit 1 }

      # Catches the manifest-mode packaging mistakes that otherwise reach a
      # user: a declared source that is not actually in the ZIP.
      - name: Validate installer manifest
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/*-installer.zip | Select-Object -First 1
          node cameraunlock-core/scripts/validate-manifest.mjs $zip.FullName

      # Unzip the installer so upload-artifact does not nest a zip in its zip.
      - name: Stage installer contents for artifact upload
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/*-installer.zip -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $zip) {
            Write-Host "::error::No installer ZIP was produced by 'pixi run package'"
            exit 1
          }
          $dest = "release/artifact-contents"
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath $dest -Force
          Write-Host "Staged $($zip.Name) -> $dest" -ForegroundColor Green

      - name: Compute artifact name from ref
        id: artifact
        shell: pwsh
        run: |
          $branch = if ($env:GITHUB_HEAD_REF) { $env:GITHUB_HEAD_REF } else { $env:GITHUB_REF_NAME }
          $sanitized = $branch -replace '[^A-Za-z0-9._-]', '-'
          "name=Portal2HeadTracking-$sanitized" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: release/artifact-contents/
          retention-days: 14
          if-no-files-found: error
